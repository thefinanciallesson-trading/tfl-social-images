<!DOCTYPE html>
<html><head><meta charset="utf-8">
<style>
@font-face{font-family:PM;src:url(fonts/PermanentMarker-Regular.ttf)}
@font-face{font-family:CV;src:url("fonts/Caveat%5Bwght%5D.ttf");font-weight:400 700}
@font-face{font-family:PH;src:url(fonts/PatrickHand-Regular.ttf)}
html,body{margin:0;width:1080px;height:1350px;overflow:hidden}
body.paper{background:#FCFBF6 repeating-linear-gradient(#FCFBF6 0 51px,#D1DDF2 51px 53px,#FCFBF6 53px 54px);background-position:0 1px}
body.layer{background:transparent}
#page{position:relative;width:1080px;height:1350px}
.margin{position:absolute;left:104px;top:0;width:3px;height:1350px;background:#EDACA8}
.hole{position:absolute;left:32px;width:44px;height:44px;border-radius:50%;background:#262A3A}
body.layer .margin,body.layer .hole{display:none}

body.layer .blk{visibility:hidden}
body.layer .blk.on{visibility:visible}
.blk{position:absolute;left:140px;right:64px;color:#1F2340}
.kick{font-family:CV;font-weight:700;font-size:46px;color:#C8423B;transform:rotate(-1.5deg);transform-origin:left}
.t1{font-family:PM;font-size:96px;line-height:1;letter-spacing:1px}
.t2{display:inline-block;font-family:PM;font-size:96px;line-height:1;background:#FFDD45;padding:10px 22px 6px 22px;margin-left:-4px;transform:rotate(-1deg)}
.intro{font-family:PH;font-size:33px;line-height:1.3}
.intro b{font-family:PH;font-weight:700;text-decoration:none;-webkit-text-stroke:.6px #1F2340}
.row{display:flex;align-items:center;gap:26px}
.row .lab{width:215px;flex:none}
.row .lab .big{font-family:PM;font-size:40px;line-height:1}
.row .lab .sm{font-family:PH;font-size:25px}
.row .box{flex:none;border:3px solid #1F2340;border-radius:8px}
.row .txt .big{font-family:PM;font-size:38px;line-height:1.05}
.row .txt .sm{font-family:PH;font-size:28px;line-height:1.2}
.step{display:flex;gap:24px;align-items:flex-start}
.num{flex:none;width:62px;height:62px;border-radius:50%;border:3px solid #1F2340;font-family:PM;font-size:34px;display:flex;align-items:center;justify-content:center;background:#fff}
.step .h{font-family:PM;font-size:36px;line-height:1.05}
.step .p{font-family:PH;font-size:29px;line-height:1.2;margin-top:4px}
.tip{background:#FFDD45;border:3px solid #1F2340;border-radius:18px;padding:16px 24px;transform:rotate(-.6deg)}
.tip .h{font-family:PM;font-size:31px}
.tip .p{font-family:PH;font-size:30px;line-height:1.25}
.foot{display:flex;gap:20px;align-items:center}
.foot .h{font-family:PM;font-size:38px}
.foot .p{font-family:PH;font-size:26px}
.foot .q{font-family:PH;font-size:20px}
.sticky{position:absolute;left:auto;right:36px;width:182px;height:168px;background:#FFDD45;transform:rotate(3deg);box-shadow:3px 4px 8px rgba(0,0,0,.18);text-align:center;color:#1F2340}
.sticky .a{font-family:PM;font-size:29px;margin-top:4px}
.sticky .b{font-family:CV;font-weight:700;font-size:34px;line-height:.9}
.icon{position:absolute;right:62px;left:auto;top:96px}
.green{color:#1E8A43}.red{color:#C8423B}.blue{color:#2747C9}
</style></head>
<body class="paper"><div id="page">
<div class="margin"></div>
<div class="hole" style="top:191px"></div><div class="hole" style="top:654px"></div><div class="hole" style="top:1116px"></div>
__BLOCKS__
</div></body></html>
