<!doctype html><html><head><meta charset="utf-8"><style>
@font-face{font-family:PM;src:url(gf/apache/permanentmarker/PermanentMarker-Regular.ttf)}
*{margin:0;padding:0;box-sizing:border-box}
html,body{width:1080px;height:1920px;overflow:hidden;background:#FFD43B}
.a{position:absolute}.mk{font-family:PM;color:#1F2340;-webkit-text-stroke:5px currentColor;paint-order:stroke fill}
.w{display:inline-block;transform-origin:center 70%}
#h1{left:0;top:150px;width:1080px;text-align:center;font-size:100px;line-height:1.18;white-space:nowrap;letter-spacing:1px}
#zig{left:0;top:0}
#pct{left:30px;top:720px;font-size:250px;line-height:1;color:#1C7F3C;transform-origin:center}
#apy{left:70px;top:950px;font-size:86px;color:#1C7F3C;transform-origin:center}
#dol{left:200px;top:1040px;font-size:150px;color:#1C7F3C;transform-origin:center;letter-spacing:-6px}
#lapwrap{left:400px;top:540px;width:640px;height:640px;perspective:1600px}
#lid{left:40px;top:0;width:560px;height:380px;background:#1a1b22;border-radius:22px;border:6px solid #c9ccd3;transform:rotateY(-14deg);transform-origin:right center;box-shadow:0 20px 40px rgba(0,0,0,.25)}
#scr{left:20px;top:20px;width:508px;height:328px;background:#FBF8F1;overflow:hidden;
 background-image:repeating-linear-gradient(#FBF8F1 0 22px,#BFD3EA 22px 24px)}
#dim{left:20px;top:20px;width:508px;height:328px;background:#07080c}
#play{left:200px;top:120px;width:110px;height:78px;background:#FF0033;border-radius:22px;box-shadow:0 5px 14px rgba(0,0,0,.3)}
#play:after{content:"";position:absolute;left:43px;top:22px;border-left:32px solid #fff;border-top:17px solid transparent;border-bottom:17px solid transparent}
#b1{left:40px;top:258px;width:110px;height:12px;background:#E0574F;border:3px solid #1F2340;border-radius:3px}
#b2{left:360px;top:60px;width:110px;height:210px;background:#B9E3A8;border:4px solid #1F2340;border-radius:6px;transform-origin:bottom}
#prog{left:20px;top:340px;height:8px;background:#FF0033}
#ban{left:40px;top:1250px;width:1000px;height:270px;background:#1F2340;transform:rotate(-2deg);box-shadow:0 12px 24px rgba(0,0,0,.2)}
#ban div{color:#fff;-webkit-text-stroke:4px #fff;font-size:80px;line-height:1.15;text-align:center;margin-top:26px;white-space:nowrap}
#cta{left:200px;top:1590px;width:680px;height:150px;background:#fff;border-radius:75px;box-shadow:0 12px 26px rgba(0,0,0,.22);transform-origin:center}
#cta span{position:absolute;left:58px;top:38px;font:900 64px "Arial Black",Arial;color:#1F2340}
#cta i{position:absolute;right:30px;top:25px;width:100px;height:100px;border-radius:50%;background:#1F2340}
#cta i:after{content:"";position:absolute;left:38px;top:27px;border-left:34px solid #fff;border-top:23px solid transparent;border-bottom:23px solid transparent}
#note{left:0;width:1080px;top:1785px;text-align:center;font:600 30px Arial;color:#6b5510}
</style></head><body>
<div id="h1" class="a mk"><span class="w" id="w1">YOUR</span> <span class="w" id="w2">SAVINGS</span><br><span class="w" id="w3">COULD</span> <span class="w" id="w4">EARN</span> <span class="w" id="w5" style="color:#1C7F3C">MORE!</span></div>
<svg id="zig" class="a" width="1080" height="1920"><path id="zp" d="M -20 1260 L 120 1120 L 200 1190 L 330 1000 L 300 930 L 400 880 L 470 600" fill="none" stroke="#1F2340" stroke-width="20" stroke-linecap="round" stroke-linejoin="round"/>
<path id="zh" d="M 400 640 L 472 590 L 510 670" fill="none" stroke="#1F2340" stroke-width="20" stroke-linecap="round" stroke-linejoin="round"/></svg>
<div id="pct" class="a mk">4%</div>
<div id="apy" class="a mk">APY*</div>
<div id="dol" class="a mk">$$$</div>
<div id="lapwrap" class="a">
 <div id="lid" class="a"><div id="scr" class="a"><div class="a" style="left:22px;top:0;width:3px;height:328px;background:#E79C9C"></div>
   <div class="a" style="left:6px;top:40px;width:14px;height:14px;border-radius:50%;background:#333"></div><div class="a" style="left:6px;top:270px;width:14px;height:14px;border-radius:50%;background:#333"></div>
   <div class="a mk" style="left:350px;top:16px;font-size:34px;-webkit-text-stroke:1px;color:#1C7F3C">4%</div>
   <div class="a mk" style="left:38px;top:278px;font-size:38px;-webkit-text-stroke:1px;color:#C8423B">0.01%</div>
   <div class="a mk" style="left:220px;top:284px;font-size:30px;-webkit-text-stroke:1px">vs</div>
   <div class="a mk" style="left:350px;top:280px;font-size:38px;-webkit-text-stroke:1px;color:#1C7F3C">4%</div>
   <div id="b1" class="a"></div><div id="b2" class="a"></div>
  </div><div id="dim" class="a"></div><div id="play" class="a" style="left:220px;top:130px"></div><div id="prog" class="a"></div></div>
 <svg class="a" style="left:0;top:368px" width="640" height="150">
  <defs><linearGradient id="al" x1="0" x2="0" y1="0" y2="1"><stop offset="0" stop-color="#f1f2f5"/><stop offset="1" stop-color="#a6aab3"/></linearGradient></defs>
  <path d="M 70 0 L 610 0 L 640 110 L 0 110 Z" fill="url(#al)" stroke="#9aa0aa" stroke-width="2"/>
  <g id="keys"></g>
  <rect x="245" y="80" width="170" height="24" rx="6" fill="#c3c6cd" stroke="#a1a5ae"/>
  <path d="M 0 110 L 640 110 L 634 124 Q 630 130 620 130 L 20 130 Q 8 130 4 122 Z" fill="#8f939c"/>
 </svg>
</div>
<div id="ban" class="a"><div class="mk">HIGH-YIELD SAVINGS<br>ACCOUNTS EXPLAINED</div></div>
<div id="cta" class="a"><span>WATCH NOW!</span><i></i></div>
<div id="note" class="a">*Example rate. Rates vary and can change.</div>
<script>
// keyboard rows on the laptop base
let k='';for(let r=0;r<4;r++){const y=10+r*16,inset=60-r*9,n=14;const x0=70+inset*0.2-r*7,x1=610-inset*0.2+r*7;const w=(x1-x0)/n;for(let i=0;i<n;i++)k+=`<rect x="${x0+i*w+2}" y="${y}" width="${w-4}" height="12" rx="2" fill="#2a2c33"/>`}
document.getElementById('keys').innerHTML=k;
const $=id=>document.getElementById(id),cl=x=>Math.max(0,Math.min(1,x)),eo=t=>1-Math.pow(1-t,3);
function back(t){const s=1.9;t=t-1;return t*t*((s+1)*t+s)+1}
const zp=$('zp'),zl=zp.getTotalLength(),zh=$('zh'),hl=zh.getTotalLength();zp.style.strokeDasharray=zl;zh.style.strokeDasharray=hl;
function pop(el,t0,t,dur=.3,rot=0){const p=cl((t-t0)/dur);el.style.opacity=p>0?1:0;el.style.transform=`scale(${p?back(p):0}) rotate(${rot}deg)`}
function render(t){
 ['w1','w2','w3','w4','w5'].forEach((w,i)=>{const p=cl((t-0.08-i*0.15)/0.22);const e=$(w);e.style.opacity=p>0?1:0;e.style.transform=`scale(${1.8-0.8*eo(p)}) rotate(${(1-p)*-8}deg)`});
 zp.style.strokeDashoffset=zl*(1-eo(cl((t-0.9)/0.9)));zh.style.strokeDashoffset=hl*(1-cl((t-1.75)/0.15));
 pop($('pct'),1.15,t,.35,-3);pop($('apy'),1.5,t,.3,-6);pop($('dol'),1.7,t,.3,-4);
 let l=cl((t-1.3)/0.55);$('lapwrap').style.transform=`translateX(${700*(1-eo(l))}px) rotate(${6*(1-eo(l))}deg) scale(.95)`;
 $('dim').style.opacity=1-cl((t-1.9)/0.3);
 let pl=cl((t-2.15)/0.3);$('play').style.transform=`scale(${pl?back(pl):0})`;
 $('b2').style.transform=`scaleY(${eo(cl((t-2.3)/0.6))})`;$('b1').style.opacity=cl((t-2.25)/0.2);
 $('prog').style.width=(508*0.45*cl((t-2.4)/4.6))+'px';
 let b=cl((t-2.85)/0.45);$('ban').style.transform=`rotate(-2deg) translateX(${-1150*(1-eo(b))}px)`;
 $('note').style.opacity=cl((t-3.4)/0.4);
 let s=cl((t-4.05)/0.25),e2=s*s;$('cta').style.opacity=t<4.05?0:(0.35+0.65*cl(s*1.6));
 let pulse=t>4.6?1+0.045*Math.sin((t-4.6)*6.5):1;
 $('cta').style.transform=`translate(${-90*(1-e2)}px,${-120*(1-e2)}px) scale(${(1.28-0.28*e2)*pulse}) rotate(${4*(1-e2)}deg)`;
}
render(0);
</script></body></html>
